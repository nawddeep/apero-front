<!DOCTYPE html>
<!-- admin/bookings.html -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APERO Admin — Bookings</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="admin-topbar">
    <div class="admin-topbar-inner">
      <div class="brand">APERO <small>ADMIN PORTAL</small></div>
      <nav class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="bookings.html" class="active">Bookings</a>
        <a href="checkin.html">Check-in</a>
        <a href="#" id="logoutLink">Logout</a>
      </nav>
    </div>
  </header>
  <div class="container">
    <h1>Bookings</h1>
    <p class="muted">Search and filter every reservation. Click Export for a CSV download.</p>
    <div id="alert" class="alert error" style="display:none"></div>
    <div class="card">
      <div class="toolbar">
        <input id="q" type="search" placeholder="Search ref, name, email, phone..." aria-label="Search bookings">
        <select id="tierFilter" aria-label="Filter by tier">
          <option value="">All tiers</option>
          <option value="early-bird">early-bird</option>
          <option value="stage1">stage1</option>
          <option value="group5">group5</option>
          <option value="group8">group8</option>
        </select>
        <select id="statusFilter" aria-label="Filter by check-in status">
          <option value="">All statuses</option>
          <option value="false">Pending</option>
          <option value="true">Checked in</option>
        </select>
        <button class="btn-secondary" id="searchBtn" type="button">Search</button>
        <button class="btn-secondary" id="exportBtn" type="button">Export CSV</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Ref</th><th>Holder</th><th>Tier × Qty</th><th>Mask</th><th>Total</th><th>Status</th><th>Purchased</th></tr>
          </thead>
          <tbody id="rows"><tr><td colspan="7">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="admin.js"></script>
  <script>
    (function () {
      if (!AperoAdmin.requireAuth()) return;
      document.getElementById('logoutLink').addEventListener('click', function (e) {
        e.preventDefault();
        AperoAdmin.logout();
      });
      var alertBox = document.getElementById('alert');
      function inr(n) { return '₹' + Number(n || 0).toLocaleString('en-IN'); }
      async function load() {
        AperoAdmin.hideAlert(alertBox);
        try {
          var params = new URLSearchParams();
          var q = document.getElementById('q').value.trim();
          var tier = document.getElementById('tierFilter').value;
          var st = document.getElementById('statusFilter').value;
          if (q) params.set('search', q);
          if (tier) params.set('tier', tier);
          if (st !== '') params.set('check_in_status', st);
          var qs = params.toString();
          var data = await AperoAdmin.apiFetch('/api/admin/bookings' + (qs ? '?' + qs : ''));
          var rows = data.bookings || [];
          var tb = document.getElementById('rows');
          if (!rows.length) { tb.innerHTML = '<tr><td colspan="7">No bookings match.</td></tr>'; return; }
          tb.innerHTML = rows.map(function (r) {
            var d = r.purchase_date ? new Date(r.purchase_date).toLocaleString('en-IN') : '—';
            return '<tr><td><code class="inline">' + AperoAdmin.esc(r.booking_ref) + '</code></td>' +
              '<td>' + AperoAdmin.esc(r.holder_name) + '<br><span class="muted">' + AperoAdmin.esc(r.email) + ' · ' + AperoAdmin.esc(r.phone) + '</span></td>' +
              '<td>' + AperoAdmin.esc(r.tier) + ' × ' + r.quantity + '</td>' +
              '<td>' + AperoAdmin.esc(r.mask_selected) + '</td>' +
              '<td>' + inr(r.total) + '</td>' +
              '<td>' + (r.check_in_status ? '<span class="badge checked">checked in</span>' : '<span class="badge pending">pending</span>') + '</td>' +
              '<td class="muted">' + AperoAdmin.esc(d) + '</td></tr>';
          }).join('');
        } catch (err) {
          AperoAdmin.showAlert(alertBox, 'error', err.message || 'Failed to load bookings');
        }
      }
      document.getElementById('searchBtn').addEventListener('click', load);
      document.getElementById('q').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); load(); }
      });
      document.getElementById('exportBtn').addEventListener('click', async function () {
        AperoAdmin.hideAlert(alertBox);
        try {
          var token = AperoAdmin.getToken();
          var controller = new AbortController();
          var timer = setTimeout(function () { controller.abort(); }, 15000);
          try {
            var res = await fetch('/api/admin/export', {
              headers: { Authorization: 'Bearer ' + token },
              signal: controller.signal
            });
            if (res.status === 401) { AperoAdmin.logout(); return; }
            if (!res.ok) throw new Error('Export failed (' + res.status + ')');
            var blob = await res.blob();
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'apero-bookings.csv';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
          } finally {
            clearTimeout(timer);
          }
        } catch (err) {
          AperoAdmin.showAlert(alertBox, 'error', err.message || 'Export failed');
        }
      });
      load();
    })();
  </script>
</body>
</html>
