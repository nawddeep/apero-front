<!DOCTYPE html>
<!-- admin/dashboard.html -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APÉRO Admin — Dashboard</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="appNav"></div>
  <div class="container">
    <h1>Dashboard</h1>
    <p class="muted">Live overview of ticket sales and gate activity.</p>
    <div id="bootError" class="alert error" style="display:none"><span id="bootErrorMsg"></span></div>
    <div id="alert" class="alert error" style="display:none"></div>

    <div class="grid-stats" id="statsGrid">
      <div class="stat"><div class="label">Total orders</div><div class="value" id="stOrders">—</div></div>
      <div class="stat"><div class="label">Paid orders</div><div class="value" id="stPaidOrders">—</div></div>
      <div class="stat"><div class="label">Gross revenue</div><div class="value" id="stRevenue">—</div></div>
      <div class="stat"><div class="label">Refunded</div><div class="value" id="stRefunded">—</div></div>
      <div class="stat"><div class="label">Passes sold</div><div class="value" id="stTickets">—</div></div>
      <div class="stat"><div class="label">Checked in</div><div class="value" id="stChecked">—</div></div>
      <div class="stat wide"><div class="label">Sales by tier (paid)</div><div id="byTier" class="hint">Loading…</div></div>
      <div class="stat wide"><div class="label">Check-in rate</div><div class="value" id="stCheckinRate">—</div></div>
    </div>

    <div class="card mt">
      <h2>Recent orders</h2>
      <div class="toolbar">
        <button class="btn-secondary" id="refreshBtn" type="button">Refresh</button>
        <button class="btn-secondary" id="exportBtn" type="button">Export CSV</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Order</th><th>Event</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th>Created</th></tr>
          </thead>
          <tbody id="recentBody"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="src/supabaseClient.js"></script>
  <script src="admin.js"></script>
  <script>
    (function () {
      'use strict';
      const A = window.AperoAdmin;
      A.renderNav('Dashboard');
      const alertBox = document.getElementById('alert');
      const tb = document.getElementById('recentBody');

      async function boot() {
        const ctx = await A.ensureAdmin();
        if (!ctx) return;
        document.getElementById('logoutAreaHidden');
        await load();
      }

      async function count(qb) { const { count, error } = await qb; if (error) throw error; return count || 0; }
      async function sumField(qb, field) {
        const { data, error } = await qb;
        if (error) throw error;
        return (data || []).reduce((s, r) => s + Number(r[field] || 0), 0);
      }

      async function load() {
        A.hideAlert(alertBox);
        try {
          const c = supabaseClient;

          const [totalOrders, paidOrders, grossRev, refunded, tickets, checkedIn] = await Promise.all([
            count(c.from('orders').select('id', { count: 'exact', head: true })),
            count(c.from('orders').select('id', { count: 'exact', head: true }).eq('status', 'paid')),
            sumField(c.from('orders').select('total_amount').eq('status', 'paid'), 'total_amount'),
            sumField(c.from('refunds').select('amount').in('status', ['processed', 'pending']), 'amount'),
            count(c.from('ticket_holders').select('id', { count: 'exact', head: true })),
            count(c.from('ticket_holders').select('id', { count: 'exact', head: true }).eq('check_in_status', 'checked_in'))
          ]);
          const { data: tierRows, error: tierErr } = await c
            .from('order_items')
            .select('quantity, ticket_types!inner(name)')
            .eq('orders.status', 'paid');
          if (tierErr) throw tierErr;
          const byTier = {};
          for (const r of tierRows || []) {
            const name = r.ticket_types && r.ticket_types.name || '—';
            byTier[name] = (byTier[name] || 0) + Number(r.quantity || 0);
          }

          document.getElementById('stOrders').textContent = totalOrders;
          document.getElementById('stPaidOrders').textContent = paidOrders;
          document.getElementById('stRevenue').textContent = A.inr(grossRev);
          document.getElementById('stRefunded').textContent = A.inr(refunded);
          document.getElementById('stTickets').textContent = tickets;
          document.getElementById('stChecked').textContent = checkedIn + ' / ' + tickets;
          document.getElementById('stCheckinRate').textContent = tickets ? Math.round((checkedIn / tickets) * 100) + '%' : '—';
          const tierKeys = Object.keys(byTier);
          document.getElementById('byTier').innerHTML = tierKeys.length
            ? tierKeys.map((k) => '<span class="badge" style="margin:2px;">' + A.esc(k) + ' &times; ' + byTier[k] + '</span>').join(' ')
            : 'No paid sales yet.';

          const { data: recent, error: recentErr } = await c
            .from('orders')
            .select('id, total_amount, currency, status, created_at, events(name), order_items(quantity, ticket_types(name)), payments(status)')
            .order('created_at', { ascending: false })
            .limit(10);
          if (recentErr) throw recentErr;
          if (!recent || !recent.length) {
            tb.innerHTML = '<tr><td colspan="7" class="empty">No orders yet.</td></tr>';
            return;
          }
          tb.innerHTML = recent.map((o) => {
            const items = (o.order_items || []).map((it) => (it.ticket_types ? it.ticket_types.name + ' ×' + it.quantity : '×' + it.quantity)).join(', ');
            const pay = (o.payments && o.payments.length ? o.payments[o.payments.length - 1].status : '');
            return '<tr>' +
              '<td><code class="inline">' + A.esc(String(o.id).slice(0, 8)) + '…</code></td>' +
              '<td>' + A.esc((o.events && o.events.name) || '—') + '</td>' +
              '<td>' + A.esc(items || '—') + '</td>' +
              '<td>' + A.inr(o.total_amount) + '</td>' +
              '<td>' + A.statusBadge(pay) + '</td>' +
              '<td>' + A.statusBadge(o.status) + '</td>' +
              '<td>' + A.esc(A.fmtDT(o.created_at)) + '</td>' +
              '</tr>';
          }).join('');
        } catch (err) {
          A.showAlert(alertBox, err.message || 'Failed to load dashboard');
          tb.innerHTML = '<tr><td colspan="7" class="empty">Failed to load.</td></tr>';
        }
      }

      document.getElementById('refreshBtn').addEventListener('click', load);
      document.getElementById('exportBtn').addEventListener('click', async function () {
        A.hideAlert(alertBox);
        try {
          const raw = await A.apiFetch('/api/admin/export');
          // apiFetch returns parsed JSON; export sends CSV — handle raw text separately.
        } catch (e) {
          // Fall through to direct fetch below on parse errors.
        }
        try {
          const token = A.getToken();
          const base = A.apiBase();
          const res = await fetch(base + '/api/admin/export', { headers: token ? { Authorization: 'Bearer ' + token } : {} });
          if (res.status === 401) { A.logout(); return; }
          if (!res.ok) throw new Error('Export failed (' + res.status + ')');
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'apero-orders.csv';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        } catch (err) {
          A.showAlert(alertBox, err.message || 'Export failed');
        }
      });

      boot();
    })();
  </script>
</body>
</html>
