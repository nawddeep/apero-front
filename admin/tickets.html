<!DOCTYPE html>
<!-- admin/tickets.html -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APÉRO Admin — Tickets</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="appNav"></div>
  <div class="container">
    <h1>Tickets</h1>
    <p class="muted">Every issued pass code (created only after successful payment).</p>
    <div id="bootError" class="alert error" style="display:none"><span id="bootErrorMsg"></span></div>
    <div id="alert" class="alert error" style="display:none"></div>
    <div class="toolbar">
      <select id="fEvent"><option value="">All events</option></select>
      <select id="fCheckin">
        <option value="">All check-in states</option>
        <option value="not_checked_in">Not checked in</option>
        <option value="checked_in">Checked in</option>
      </select>
      <button class="btn-secondary" id="refreshBtn" type="button">Refresh</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Pass code</th><th>Holder</th><th>Tier</th><th>Event</th><th>Check-in</th><th>Checked in at</th></tr>
        </thead>
        <tbody id="ticketsBody"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="src/supabaseClient.js"></script>
  <script src="admin.js"></script>
  <script>
    (function () {
      'use strict';
      const A = window.AperoAdmin;
      A.renderNav('Tickets');
      const alertBox = document.getElementById('alert');
      const tb = document.getElementById('ticketsBody');
      const fEvent = document.getElementById('fEvent');
      const fCheckin = document.getElementById('fCheckin');

      async function boot() {
        const ctx = await A.ensureAdmin();
        if (!ctx) return;
        await loadEvents();
        await load();
      }

      async function loadEvents() {
        try {
          const { data, error } = await supabaseClient
            .from('events')
            .select('id, name, event_date')
            .order('event_date', { ascending: false });
          if (error) throw error;
          fEvent.innerHTML = '<option value="">All events</option>' +
            (data || []).map((e) => '<option value="' + A.esc(e.id) + '">' + A.esc(e.name) + '</option>').join('');
        } catch (err) {
          A.showAlert(alertBox, err.message || 'Failed to load events');
        }
      }

      async function load() {
        A.hideAlert(alertBox);
        try {
          let qb = supabaseClient
            .from('ticket_holders')
            .select('id, name, age, gender, phone, ticket_code, check_in_status, checked_in_at, order_items(ticket_types(name, event_id), orders(events(id, name)))')
            .order('created_at', { ascending: false })
            .limit(500);
          const ev = fEvent.value;
          const ci = fCheckin.value;
          if (ci) qb = qb.eq('check_in_status', ci);
          if (ev) {
            const { data: oiIds, error: oiErr } = await supabaseClient
              .from('order_items')
              .select('id, ticket_types(event_id)')
              .eq('ticket_types.event_id', ev);
            if (oiErr) throw oiErr;
            const ids = (oiIds || []).map((r) => r.id);
            if (!ids.length) { tb.innerHTML = '<tr><td colspan="6" class="empty">No tickets for this event.</td></tr>'; return; }
            qb = qb.in('order_item_id', ids);
          }
          const { data, error } = await qb;
          if (error) throw error;

          if (!data || !data.length) {
            tb.innerHTML = '<tr><td colspan="6" class="empty">No tickets found.</td></tr>';
            return;
          }
          tb.innerHTML = data.map((t) => {
            const evName = (t.order_items && t.order_items.orders && t.order_items.orders.events && t.order_items.orders.events.name) || (t.order_items && t.order_items.ticket_types ? '(no event)' : '—');
            const tier = (t.order_items && t.order_items.ticket_types && t.order_items.ticket_types.name) || '—';
            return '<tr>' +
              '<td><code class="inline" style="letter-spacing:0.1em;">' + A.esc(t.ticket_code) + '</code></td>' +
              '<td>' + A.esc(t.name || '—') + '<br><span class="muted">' + A.esc(t.phone || '') + '</span></td>' +
              '<td>' + A.esc(tier) + '</td>' +
              '<td>' + A.esc(evName) + '</td>' +
              '<td>' + (t.check_in_status === 'checked_in' ? '<span class="badge ok">Checked in</span>' : '<span class="badge muted">Not checked in</span>') + '</td>' +
              '<td>' + A.esc(A.fmtDT(t.checked_in_at)) + '</td>' +
              '</tr>';
          }).join('');
        } catch (err) {
          A.showAlert(alertBox, err.message || 'Failed to load tickets');
          tb.innerHTML = '<tr><td colspan="6" class="empty">Failed to load.</td></tr>';
        }
      }

      fEvent.addEventListener('change', load);
      fCheckin.addEventListener('change', load);
      document.getElementById('refreshBtn').addEventListener('click', load);
      boot();
    })();
  </script>
</body>
</html>
