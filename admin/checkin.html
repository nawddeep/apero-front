<!DOCTYPE html>
<!-- admin/checkin.html -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APÉRO Admin — Check-in</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="appNav"></div>
  <div class="container">
    <h1>Check-in</h1>
    <p class="muted">Scan or type a pass code to validate and check a guest in.</p>
    <div id="bootError" class="alert error" style="display:none"><span id="bootErrorMsg"></span></div>
    <div id="alert" class="alert error" style="display:none"></div>

    <div class="checkin-strip card">
      <input id="codeInput" type="text" placeholder="AP-XXXX XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <p class="muted" style="margin:8px 0 0; font-size:13px;">Format: AP-XXXX XXXX (spaces optional)</p>
    </div>

    <div id="result" class="card checkin-card" style="display:none;"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="src/supabaseClient.js"></script>
  <script src="admin.js"></script>
  <script>
    (function () {
      'use strict';
      const A = window.AperoAdmin;
      A.renderNav('Check-in');
      const alertBox = document.getElementById('alert');
      const result = document.getElementById('result');
      const input = document.getElementById('codeInput');

      async function boot() {
        const ctx = await A.ensureAdmin();
        if (!ctx) return;
        input.focus();
      }

      function normalize(code) {
        return String(code || '').trim().toUpperCase().replace(/\s+/g, '').replace(/-/g, '');
      }

      async function lookup() {
        A.hideAlert(alertBox);
        const raw = normalize(input.value);
        if (raw.length < 10) { flashResult('error', 'Enter a full pass code.', null); return; }
        const clean = raw.slice(0, 2) + '-' + raw.slice(2);
        try {
          const { data, error } = await supabaseClient
            .from('ticket_holders')
            .select('id, name, age, gender, phone, ticket_code, check_in_status, checked_in_at, order_items(ticket_types(name), orders(id, status, events(name, venue, event_date, start_time)))')
            .eq('ticket_code', clean)
            .maybeSingle();
          if (error) throw error;
          if (!data) { flashResult('error', 'No pass found for code ' + clean + '.', null); return; }
          if (data.check_in_status === 'checked_in') {
            flashResult('warn', 'Already checked in.', data);
            return;
          }
          flashResult('ok', null, data);
        } catch (err) {
          flashResult('error', err.message || 'Lookup failed', null);
        }
      }

      function flashResult(type, msg, holder) {
        result.style.display = 'block';
        result.className = 'card checkin-card checkin-' + (type === 'error' || type === 'warn' ? 'fail' : 'success');
        if (!holder) {
          result.innerHTML = '<div class="holder" style="text-align:center;">' + A.esc(msg) + '</div>';
          return;
        }
        const ev = holder.order_items.orders.events || {};
        const tier = holder.order_items.ticket_types || {};
        const dateStr = ev.event_date ? A.fmtDate(ev.event_date) : '—';
        const timeStr = holder.order_items.orders.events ? (ev.start_time || '').slice(0, 5) : '—';
        result.innerHTML =
          (type === 'ok'
            ? '<div class="holder">' + A.esc(holder.name) + ', you are in.</div>' +
              '<div class="meta">' + A.esc(tier.name) + ' &bull; ' + A.esc(ev.name) + ' &bull; ' + A.esc(dateStr) + ' ' + A.esc(timeStr) + '</div>' +
              '<div class="meta">Code <code class="inline" style="letter-spacing:0.1em;">' + A.esc(holder.ticket_code) + '</code>' + (holder.age ? ' &bull; Age ' + A.esc(holder.age) : '') + ' &bull; 21+ check: ' + (Number(holder.age) >= 21 ? 'OK' : (holder.age ? 'UNDER 21' : 'NOT VERIFIED')) + '</div>' +
              '<div class="checkin-action"><button class="btn-primary" id="confirmBtn" style="width:auto; padding:12px 22px;">Confirm Check-in</button></div>'
            : '<div class="holder">' + A.esc(msg || 'Pass already used') + '</div>' +
              '<div class="meta">' + A.esc(holder.name || '') + ' &bull; ' + A.esc(tier.name || '') + ' &bull; ' + A.esc(ev.name || '') + '</div>' +
              (holder.checked_in_at ? '<div class="meta">Checked in earlier at ' + A.esc(A.fmtDT(holder.checked_in_at)) + '</div>' : '') +
              (type === 'ok'
                ? '<div class="checkin-action"><button class="btn-primary" id="confirmBtn" style="width:auto; padding:12px 22px;">Confirm Check-in</button></div>'
                : '')
        );
        const confirmBtn = document.getElementById('confirmBtn');
        if (confirmBtn && type === 'ok') {
          confirmBtn.addEventListener('click', async () => {
            try {
              const { error } = await supabaseClient
                .from('ticket_holders')
                .update({ check_in_status: 'checked_in', checked_in_at: new Date().toISOString(), checked_in_by: null })
                .eq('id', holder.id);
              if (error) throw error;
              input.value = '';
              result.innerHTML = '<div class="holder">' + A.esc(holder.name) + ' checked in successfully.</div>';
              setTimeout(() => { result.style.display = 'none'; input.focus(); }, 1600);
            } catch (err) {
              flashResult('error', err.message || 'Check-in failed', null);
            }
          });
        }
        input.select();
      }

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); lookup(); }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement !== input) { e.preventDefault(); input.focus(); }
      });

      boot();
    })();
  </script>
</body>
</html>
