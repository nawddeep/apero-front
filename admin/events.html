<!DOCTYPE html>
<!-- admin/events.html -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APÉRO Admin — Events</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="appNav"></div>
  <div class="container">
    <h1>Events</h1>
    <p class="muted">Create and manage events and their ticket types.</p>
    <div id="bootError" class="alert error" style="display:none"><span id="bootErrorMsg"></span></div>
    <div id="alert" class="alert error" style="display:none"></div>
    <div class="toolbar" style="align-items:flex-end;">
      <div style="flex:1;"></div>
      <a href="event-edit.html" class="btn-primary" style="text-decoration:none; text-align:center; display:inline-block; width:auto; padding:11px 18px; background:#e50914; color:#fff; border-radius:8px; font-weight:700;">+ New Event</a>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Name</th><th>Date</th><th>Venue</th><th>Tiers</th><th>Sold / Cap</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="eventsBody"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="src/supabaseClient.js"></script>
  <script src="admin.js"></script>
  <script>
    (function () {
      'use strict';
      const A = window.AperoAdmin;
      A.renderNav('Events');
      const alertBox = document.getElementById('alert');
      const tb = document.getElementById('eventsBody');

      async function boot() {
        const ctx = await A.ensureAdmin();
        if (!ctx) return;
        await load();
      }

      async function load() {
        A.hideAlert(alertBox);
        try {
          const c = supabaseClient;
          const { data: events, error } = await c
            .from('events')
            .select('id, name, slug, event_date, venue, status, ticket_types(id, total_quantity, sold_quantity, status)')
            .order('event_date', { ascending: false });
          if (error) throw error;

          if (!events || !events.length) {
            tb.innerHTML = '<tr><td colspan="7" class="empty">No events yet. Create your first event.</td></tr>';
            return;
          }
          tb.innerHTML = events.map((ev) => {
            const tiers = ev.ticket_types || [];
            const active = tiers.filter((t) => t.status === 'active');
            const sold = active.reduce((s, t) => s + Number(t.sold_quantity || 0), 0);
            const cap = active.reduce((s, t) => s + Number(t.total_quantity || 0), 0);
            const showRemaining = cap ? (cap - sold) : 0;
            return '<tr>' +
              '<td><strong>' + A.esc(ev.name) + '</strong><br><span class="muted">/' + A.esc(ev.slug) + '</span></td>' +
              '<td>' + A.esc(A.fmtDate(ev.event_date)) + '</td>' +
              '<td>' + A.esc(ev.venue || '—') + '</td>' +
              '<td>' + tiers.length + ' tier' + (tiers.length === 1 ? '' : 's') + ' <span class="muted">(' + active.length + ' active)</span></td>' +
              '<td><strong>' + sold + '</strong> / ' + cap + ' <span class="muted">(' + showRemaining + ' left)</span></td>' +
              '<td>' + A.statusBadge(ev.status) + '</td>' +
              '<td><div class="table-actions">' +
                '<a class="btn-mini" href="event-edit.html?id=' + encodeURIComponent(ev.id) + '">Edit</a>' +
                '<button class="btn-danger" data-del="' + encodeURIComponent(ev.id) + '">Delete</button>' +
              '</div></td>' +
              '</tr>';
          }).join('');

          tb.querySelectorAll('button[data-del]').forEach((btn) => {
            btn.addEventListener('click', async () => {
              const id = decodeURIComponent(btn.getAttribute('data-del'));
              if (!window.confirm('Delete this event and its ticket types? This cannot be undone.')) return;
              btn.disabled = true;
              try {
                // Remove related rows first, then the event.
                const { error: tErr } = await c.from('ticket_types').delete().eq('event_id', id);
                let firstErr = tErr;
                const { error } = await c.from('events').delete().eq('id', id);
                if (error) {
                  firstErr = firstErr || error;
                  if (/FK|foreign key|constraint/.test(String(error.message)) || /relation/.test(String(error.message))) {
                    throw new Error('This event has orders/payments. Mark it as cancelled instead of deleting.');
                  }
                  throw error;
                }
                if (firstErr && !/constraint|foreign key/.test(String(firstErr.message))) throw firstErr;
                await load();
              } catch (err) {
                A.showAlert(alertBox, err.message || 'Delete failed');
                btn.disabled = false;
              }
            });
          });
        } catch (err) {
          A.showAlert(alertBox, err.message || 'Failed to load events');
          tb.innerHTML = '<tr><td colspan="7" class="empty">Failed to load.</td></tr>';
        }
      }

      window.confirm = window.confirm;
      boot();
    })();
  </script>
</body>
</html>
